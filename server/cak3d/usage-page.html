<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAK3Dvision API Usage</title>
<style>
  :root { color-scheme: dark; --bg:#07090d; --card:#10151d; --line:#1f2935; --text:#d8e2ee; --dim:#7d8b9b;
          --ok:#3fbf7f; --warn:#e0a030; --over:#e05252; --unset:#56606c; --accent:#5ab0ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
  h1 { margin:0; font-size:18px; letter-spacing:.08em; text-transform:uppercase; }
  header .meta { color:var(--dim); font-size:12px; }
  header a { color:var(--accent); font-size:12px; }
  main { padding:16px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); max-width:1400px; margin:0 auto; }
  .summary { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
  .card.dim { opacity:.55; }
  .card h2 { margin:0 0 2px; font-size:15px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:1px 6px; border-radius:4px; background:#1b2430; color:var(--dim); }
  .tag.key-on { color:var(--ok); } .tag.key-off { color:var(--dim); }
  .note { color:var(--dim); font-size:12px; margin:4px 0 8px; }
  .note a { color:var(--accent); }
  .metric { border-top:1px solid var(--line); padding:8px 0 4px; }
  .mrow { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .mname { font-weight:600; }
  .nums { font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; text-align:right; }
  .nums b { color:var(--text); font-size:14px; }
  .bar { height:6px; background:#1b2430; border-radius:3px; overflow:hidden; margin:6px 0; }
  .bar > i { display:block; height:100%; }
  .spark { display:flex; gap:2px; align-items:flex-end; height:22px; margin:4px 0; }
  .spark > i { flex:1; background:#2a3a4d; min-height:1px; border-radius:1px; }
  .spark > i:last-child { background:var(--accent); }
  .limits { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--dim); }
  .limits input { width:90px; background:#0b0f15; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:3px 6px; font:inherit; }
  button { background:#1b2a3c; color:var(--text); border:1px solid #2c3f56; border-radius:5px; padding:3px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .block { font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center; margin-top:6px; }
  .empty { color:var(--dim); font-size:12px; border-top:1px solid var(--line); padding-top:8px; }
  .s-ok{color:var(--ok)} .s-warn{color:var(--warn)} .s-over{color:var(--over)} .s-unset{color:var(--unset)}
  #err { grid-column:1/-1; color:var(--over); }
  @media (max-width:420px){ main{padding:10px;grid-template-columns:1fr} .limits input{width:76px} }
</style>
</head>
<body>
<header>
  <h1>CAK3Dvision · API usage</h1>
  <span class="meta" id="meta">loading…</span>
  <a href="/">← back to the globe</a>
</header>
<main id="app"></main>
<script type="module" src="/cak3d/usage-page.js"></script>
</body>
</html>
